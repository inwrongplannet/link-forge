version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://link_forge_user:password123@db:5432/link_forge
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_change_in_production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # Migrations run via Dockerfile CMD (alembic upgrade head)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=link_forge_user
      - POSTGRES_PASSWORD=password123
      - POSTGRES_DB=link_forge
    ports:
      - "5433:5432"
    command:
      - postgres
      - -c
      - max_connections=160
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U link_forge_user -d link_forge"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
  
  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"

volumes:
  postgres_data:
  redis_data:
